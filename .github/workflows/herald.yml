# Глашатай Ордену (пуші): біжить тут, у публічному сховищі, бо хвилини Actions тут безкоштовні; дані й стан — у приватному Cluckh/vows-private.
# Ранкові (9:00) і вечірні (18:30) вісті за Києвом, з 9:00 до 22:00 — моменти писаря з пушем; кожне вікно — раз на день (push/state.json),
# тож зайві, запізнілі чи пропущені запуски не дублюють вістей.
#
# БЕЗПЕКА: лог публічний — вивід скрипта приглушено повністю (ключі вістей, тексти, адреси пристроїв туди не потрапляють);
# з приватного беруться лише потрібні теки. Секрет PRIVATE_TOKEN — той самий, що для sync.yml.
name: herald
on:
  repository_dispatch:
    types: [herald]
  schedule:
    - cron: "5 6,7,9 * * *"
    - cron: "35 15,16,18 * * *"
    - cron: "35 11 * * *"
  workflow_dispatch:
permissions: {}
concurrency: herald
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: вісті
        env:
          TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set +x
          [ -n "$TOKEN" ] || { echo "секрет PRIVATE_TOKEN не задано — пропуск"; exit 0; }
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOKEN}@github.com/Cluckh/vows-private.git" p >/dev/null 2>&1 || { echo "немає доступу до приватного сховища"; exit 1; }
          cd p
          git sparse-checkout set --no-cone /tools/ /content/ /push/ /writer/ /health/ /vault.key /package.json /package-lock.json >/dev/null 2>&1 || { echo "не вдалося взяти файли"; exit 1; }
          npm ci --silent >/dev/null 2>&1 || { echo "npm не вдався"; exit 1; }
          if [ "$EVENT" = "repository_dispatch" ]; then export HERALD_PAYLOAD="$(jq -c '.client_payload // {}' "$GITHUB_EVENT_PATH")"; else export HERALD_PAYLOAD="{}"; fi
          node tools/herald.mjs >/dev/null 2>&1 || { echo "помилка глашатая"; exit 1; }
          git config user.name "herald"; git config user.email "herald@users.noreply.github.com"
          git add push/ >/dev/null 2>&1
          if git diff --cached --quiet; then echo "готово: нових вістей нема"; exit 0; fi
          git commit -q -m "глашатай: вісті $(date -u +%F)" >/dev/null 2>&1
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main >/dev/null 2>&1 && git push -q origin HEAD:main >/dev/null 2>&1 && { echo "готово: вісті надіслано"; exit 0; }
            git rebase --abort >/dev/null 2>&1 || true; sleep $((2 + RANDOM % 4))
          done
          echo "не вдалося зберегти стан"; exit 1
